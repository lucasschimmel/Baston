name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The documentation website. It renders docs/ rather than owning a copy, so
  # this job is also what proves the Markdown still links up: the build fails
  # on a link that points at nothing.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: bun install
        run: bun install --frozen-lockfile
      - name: build the docs site
        run: bun run docs:build

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --workspace
      - name: cargo test
        run: cargo test --workspace
      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings
      - name: rustfmt
        run: cargo fmt --all -- --check

  # The four supported bundles (ADR-002). A Tier 2 capability behind a Cargo
  # feature can rot without the default build noticing, so every bundle is
  # built and tested here — that is the whole reason the bundle list is short.
  bundles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - bundle: lite
            features: "--no-default-features"
          - bundle: js
            features: ""
          - bundle: lua
            features: "--no-default-features --features scripting-lua"
          # `escrow` is Windows-only at runtime but compiles everywhere; this
          # job proves the feature combination, not the runtime path.
          - bundle: full
            features: "--features scripting-lua,escrow,db-postgres,db-mysql"
    name: bundle (${{ matrix.bundle }})
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle-${{ matrix.bundle }}
      - name: cargo test
        run: cargo test -p baston-gateway -p baston-scripting ${{ matrix.features }}
      - name: cargo test (db)
        if: matrix.bundle == 'full'
        run: cargo test -p baston-db --features sqlite,postgres,mysql
      - name: cargo clippy
        run: cargo clippy -p baston-gateway --all-targets ${{ matrix.features }} -- -D warnings
      - name: report what the binary contains
        run: cargo run -p baston-gateway ${{ matrix.features }} --bin baston-gateway -- --modules
