# Phase D benchmark configuration: 2 zones on the host, meshing enabled,
# auth bypassed, 2500 slots (2000 clients + margin).
[server]
name = "BASTON Mesh Bench"
port = 30120
max_players = 2500

[resources]
path = "resources"

[udp]
poll_interval_ms = 2

[nats]
url = "nats://127.0.0.1:4222"
# zone_id comes from ZONE_ID for the zone processes.
zone_id = "gateway"

[state_sync]
sync_interval_ms = 16
# 10fps push at 2000 clients: halves the gateway's outbound packet rate
# (~40k/s → ~20k/s on one UDP socket); clients dead-reckon between updates.
push_interval_ms = 100
# 300m at benchmark density (2000 players / 61 km²) keeps per-client entity
# counts near real-server levels; 450m on this synthetic map over-densifies.
aoi_radius = 300.0
max_speed_mps = 200.0
ownership_interval_secs = 5

[meshing]
enabled = true
gateway_grpc_addr = "0.0.0.0:50050"
gateway_grpc = "127.0.0.1:50050"
heartbeat_interval_secs = 5
zone_timeout_secs = 15
boundary_margin = 300.0
boundary_scan_interval_ms = 500
handoff_cooldown_secs = 5
admin_port = 8080
admin_token = "bench-admin-token"

[metrics]
enabled = true
port = 9090

[dev]
hot_reload = false
auth_bypass = true
