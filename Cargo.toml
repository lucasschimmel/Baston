[workspace]
resolver = "2"
members = ["crates/*"]
# The cargo-fuzz harness needs nightly + libFuzzer; excluded so stable CI
# ignores it (see fuzz/README.md and .github/workflows/fuzz.yml).
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0-alpha"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.52", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
deno_core = "0.406"
# Lua 5.4 via mlua. `vendored` builds the interpreter from source so an operator
# never has to install a Lua toolchain to run the `lua` bundle.
#
# 5.4 rather than LuaJIT: luajit-src bootstraps through `minilua`, which does
# not build on Windows here, and the `lua` bundle has to build on every target
# BASTON ships. CFX supports both (`lua54` in fxmanifest), and the interpreter
# is swappable behind this one feature later — the runtime code does not care.
# Not `send`: like a V8 isolate, a Lua state lives on its own thread and is
# never shared, so requiring Send from everything it touches buys nothing.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "json", "chrono", "macros"] }
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize"] }
dashmap = "6"
notify = "8"
tower-http = { version = "0.7", features = ["trace", "cors", "timeout"] }
bcrypt = "0.17"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
# Explicit provider so rustls doesn't panic when both ring (reqwest) and aws-lc-rs (axum-server) are compiled in.
rustls = { version = "0.23", features = ["aws-lc-rs"] }
async-nats = "0.38"
bincode = { version = "2", features = ["serde"] }
bitflags = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
# Snapshot recorder for unit-testing emitted metrics (dev-only).
metrics-util = { version = "0.17", features = ["debugging"] }
futures = "0.3"
rayon = "1.10"
rusty_enet = "0.4"
rmp-serde = "1"
rsa = "0.9"
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
sha1 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
hex = "0.4"
# Constant-time byte comparison for admin-token checks (already in the tree via rsa).
subtle = "2"
# Raw LZ4 block bindings — needed for the dictionary variants
# (LZ4_compress_fast_continue / LZ4_decompress_safe_usingDict) that the
# OneSync clone stream uses. lz4_flex has no external-dictionary support.
lz4-sys = "1.11"

baston-db = { path = "crates/baston-db" }
baston-modules = { path = "crates/baston-modules" }
baston-config = { path = "crates/baston-config" }
baston-core = { path = "crates/baston-core" }
baston-protocol = { path = "crates/baston-protocol" }
baston-scripting = { path = "crates/baston-scripting", default-features = false }
baston-zone = { path = "crates/baston-zone", default-features = false }
baston-gateway = { path = "crates/baston-gateway" }
baston-cfx-platform = { path = "crates/baston-cfx-platform" }
baston-escrow-plugin = { path = "crates/baston-escrow-plugin" }
baston-voice = { path = "crates/baston-voice" }

[profile.dev]
# deno_core/v8 is extremely slow unoptimized; opt-level 1 keeps dev iteration usable.
opt-level = 1
