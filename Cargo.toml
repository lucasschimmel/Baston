[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.52", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
deno_core = "0.406"
dashmap = "6"
notify = "8"
tower-http = { version = "0.7", features = ["trace", "cors"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
# Explicit provider so rustls doesn't panic when both ring (reqwest) and aws-lc-rs (axum-server) are compiled in.
rustls = { version = "0.23", features = ["aws-lc-rs"] }
async-nats = "0.38"
bincode = { version = "2", features = ["serde"] }
bitflags = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
# Snapshot recorder for unit-testing emitted metrics (dev-only).
metrics-util = { version = "0.17", features = ["debugging"] }
futures = "0.3"
rusty_enet = "0.4"
rmp-serde = "1"
rsa = "0.9"
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
sha1 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
hex = "0.4"
# Constant-time byte comparison for admin-token checks (already in the tree via rsa).
subtle = "2"
# Raw LZ4 block bindings — needed for the dictionary variants
# (LZ4_compress_fast_continue / LZ4_decompress_safe_usingDict) that the
# OneSync clone stream uses. lz4_flex has no external-dictionary support.
lz4-sys = "1.11"

baston-config = { path = "crates/baston-config" }
baston-core = { path = "crates/baston-core" }
baston-protocol = { path = "crates/baston-protocol" }
baston-scripting = { path = "crates/baston-scripting" }
baston-zone = { path = "crates/baston-zone" }
baston-gateway = { path = "crates/baston-gateway" }
baston-escrow-plugin = { path = "crates/baston-escrow-plugin" }

[profile.dev]
# deno_core/v8 is extremely slow unoptimized; opt-level 1 keeps dev iteration usable.
opt-level = 1
