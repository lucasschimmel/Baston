// BASTON zone-federation protocol (Phase D).
// Gateway <-> Zone control plane. High-frequency state sync stays on NATS.
syntax = "proto3";
package baston;

// Implemented by the Gateway; called by Zone Servers.
service GatewayService {
  rpc RegisterZone(RegisterZoneRequest) returns (RegisterZoneResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc PrepareHandoff(PrepareHandoffRequest) returns (PrepareHandoffResponse);
  rpc ConfirmHandoff(ConfirmHandoffRequest) returns (ConfirmHandoffResponse);
  // Server-authored entities. Zones run the resources but the Gateway owns
  // the world clients talk to, so `CreateVehicle` in a zone leases ids here
  // and ships the spawn here.
  rpc LeaseNetworkIds(LeaseNetworkIdsRequest) returns (LeaseNetworkIdsResponse);
  rpc SubmitWorldCommands(WorldCommandBatch) returns (WorldCommandAck);
}

// Implemented by each Zone Server; called by the Gateway (and Zone A during
// the final activation step of a handoff, proxied through the Gateway).
service ZoneService {
  rpc PrepareForPlayer(PlayerStateRequest) returns (PrepareForPlayerResponse);
  rpc ActivatePlayer(ActivatePlayerRequest) returns (ActivatePlayerResponse);
  rpc ReleasePlayer(ReleasePlayerRequest) returns (ReleasePlayerResponse);
  // Resource control plane (admin API): the Gateway relays start/stop/restart
  // and status listing to each zone's ResourceManager.
  rpc ListResources(ListResourcesRequest) returns (ListResourcesResponse);
  rpc ControlResource(ControlResourceRequest) returns (ControlResourceResponse);
  rpc GetResmonSnapshot(ResmonSnapshotRequest) returns (ResmonSnapshotResponse);
}

// Entity classes as `GET_ENTITY_TYPE` numbers them, so the wire value and the
// native value are the same thing.
enum EntityClass {
  ENTITY_CLASS_UNSPECIFIED = 0;
  ENTITY_CLASS_PED = 1;
  ENTITY_CLASS_VEHICLE = 2;
  ENTITY_CLASS_OBJECT = 3;
}

message BoundingBox {
  float x_min = 1;
  float x_max = 2;
  float y_min = 3;
  float y_max = 4;
}

message RegisterZoneRequest {
  string zone_id = 1;
  BoundingBox bounds = 2;
  // gRPC address the Gateway can call back (ZoneService).
  string grpc_addr = 3;
  int32 max_players = 4;
}

message RegisterZoneResponse {
  bool accepted = 1;
  string message = 2;
  // What this zone owns, when the Gateway holds a zone map. Absent means no
  // map is configured and the zone keeps the bounds it declared itself.
  Coverage coverage = 3;
}

message Point2 {
  float x = 1;
  float y = 2;
}

// One claimed area. Which fields carry meaning depends on `kind`; the others
// are left at their defaults.
message Shape {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_RECT = 1;
    KIND_CIRCLE = 2;
    KIND_POLY = 3;
    KIND_EVERYWHERE = 4;
  }
  Kind kind = 1;
  BoundingBox rect = 2;
  Point2 center = 3;
  float radius = 4;
  repeated Point2 points = 5;
}

// A zone's territory: the regions it claims, minus the regions of every
// higher-priority zone that cuts into them.
message Coverage {
  repeated Shape shapes = 1;
  // Higher-priority regions overlapping `shapes`. A zone needs these to notice
  // a player *entering* an area carved out of its own.
  repeated Shape overlays = 2;
}

message HeartbeatRequest {
  string zone_id = 1;
  uint32 player_count = 2;
  uint32 entity_count = 3;
}

message HeartbeatResponse {
  bool known = 1; // false => zone was evicted, must re-register
}

message PrepareHandoffRequest {
  uint32 player_id = 1;
  string from_zone = 2;
  // Empty => Gateway picks the zone covering `predicted_x/y`.
  string target_zone = 3;
  float predicted_x = 4;
  float predicted_y = 5;
  // bincode-serialized baston_protocol::PlayerStateSnapshot (partial).
  bytes snapshot = 6;
}

message PrepareHandoffResponse {
  bool ready = 1;
  string target_zone = 2;
  string message = 3;
  // ZoneService address of the target zone, so the source zone can call
  // ActivatePlayer directly after ConfirmHandoff.
  string target_zone_grpc = 4;
}

message ConfirmHandoffRequest {
  uint32 player_id = 1;
  string from_zone = 2;
  string to_zone = 3;
}

message ConfirmHandoffResponse {
  bool ok = 1;
  string message = 2;
}

// A zone leases a block of network ids up front.
//
// `CreateVehicle` returns its handle synchronously — there is no room for a
// round trip inside the native — so the zone must be able to pick an id with
// no I/O. Blocks are carved from the Gateway's own downward allocator, which
// makes them exclusive by construction: two zones can never mint the same id,
// and a zone never collides with a client lease.
message LeaseNetworkIdsRequest {
  string zone_id = 1;
  uint32 count = 2;
}

message LeaseNetworkIdsResponse {
  bool ok = 1;
  string message = 2;
  // Highest id of the block. The zone walks downward from here, `granted`
  // times. Zero when `ok` is false.
  uint32 first_id = 3;
  // May be smaller than requested when the id space is running out.
  uint32 granted = 4;
}

// Entity mutations authored by a zone's scripts, applied by the Gateway on its
// next sync tick.
//
// Ordered: a Spawn and the Despawn that follows it must not swap. The zone
// drains its queue from a single task and sends batches sequentially, so the
// order a script wrote is the order the world sees.
message WorldCommandBatch {
  string zone_id = 1;
  repeated WorldCommand commands = 2;
}

message WorldCommand {
  oneof command {
    SpawnEntity spawn = 1;
    DespawnEntity despawn = 2;
  }
}

message SpawnEntity {
  // Must come from a block this zone leased.
  uint32 network_id = 1;
  EntityClass entity_class = 2;
  uint32 model = 3;
  float x = 4;
  float y = 5;
  float z = 6;
  // Degrees.
  float heading = 7;
  // Objects only: whether the object simulates physics.
  bool dynamic = 8;
}

message DespawnEntity {
  uint32 network_id = 1;
}

message WorldCommandAck {
  bool ok = 1;
  string message = 2;
  uint32 applied = 3;
}

message PlayerStateRequest {
  uint32 player_id = 1;
  string from_zone = 2;
  // bincode-serialized baston_protocol::PlayerStateSnapshot.
  bytes snapshot = 3;
}

message PrepareForPlayerResponse {
  bool ready = 1;
  string message = 2;
}

message ActivatePlayerRequest {
  uint32 player_id = 1;
}

message ActivatePlayerResponse {
  bool ok = 1;
  string message = 2;
}

message ReleasePlayerRequest {
  uint32 player_id = 1;
  string reason = 2;
}

message ReleasePlayerResponse {
  bool ok = 1;
}

message ListResourcesRequest {}

message ResourceStatus {
  string name = 1;
  // "unloaded" | "loading" | "started" | "stopped" | "error"
  string state = 2;
}

message ListResourcesResponse {
  repeated ResourceStatus resources = 1;
}

message ControlResourceRequest {
  string name = 1;
  // "start" | "stop" | "restart"
  string action = 2;
}

message ControlResourceResponse {
  bool ok = 1;
  string message = 2;
}

message ResmonSnapshotRequest {}

message ResmonSnapshotResponse {
  bool ok = 1;
  string message = 2;
  // JSON-serialized baston_scripting::ResMonSnapshot. This is an admin
  // diagnostic path, not a hot data-plane path, and keeps the protobuf stable
  // while ResMon fields evolve.
  string snapshot_json = 3;
}
