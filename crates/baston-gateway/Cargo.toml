[package]
name = "baston-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
dashmap = { workspace = true }
tower-http = { workspace = true }
form_urlencoded = "1"
reqwest = { workspace = true }
uuid = { workspace = true }
rsa = { workspace = true }
sha1 = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
subtle = { workspace = true }
rusty_enet = { workspace = true }
rmp-serde = { workspace = true }
async-nats = { workspace = true }
bincode = { workspace = true }
futures = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
axum-server = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tokio-rustls = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
rcgen = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tonic = { workspace = true }
prost = { workspace = true }
baston-modules = { workspace = true }
baston-config = { workspace = true }
baston-core = { workspace = true }
baston-cfx = { workspace = true }
baston-protocol = { workspace = true }
baston-scripting = { workspace = true, default-features = false }
baston-zone = { workspace = true, default-features = false }
baston-db = { workspace = true, optional = true }
baston-voice = { workspace = true }

# Tier 2 capabilities (ADR-002). Each forwards to the crate that implements it
# *and* to baston-modules, which is what `--modules` reports: a build that
# forgets the second half would under-report what it contains.
[features]
default = ["scripting-js"]
scripting-js = ["baston-modules/scripting-js", "baston-scripting/js", "baston-zone/scripting-js"]
scripting-lua = ["baston-modules/scripting-lua", "baston-scripting/lua", "baston-zone/scripting-lua"]
# The db capability, and its drivers. An operator running PostgreSQL should not
# compile a MySQL client; `db` alone gives sqlite, which needs no server.
db = ["dep:baston-db", "baston-modules/db", "baston-db/sqlite"]
db-postgres = ["db", "baston-db/postgres"]
db-mysql = ["db", "baston-db/mysql"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
toml = { workspace = true }
