[package]
name = "baston-escrow-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

# Optional plugin: adds CFX Asset Escrow support by driving svadhesive.dll
# indirectly through an FXServer sidecar subprocess (DB2b). The core never
# depends on this crate.
[dependencies]
baston-core = { workspace = true }
baston-cfx-platform = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "escrow_stub_sidecar"
path = "../baston-cfx-platform/src/bin/stub_sidecar.rs"
test = false
