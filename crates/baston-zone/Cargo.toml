[package]
name = "baston-zone"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
notify = { workspace = true }
baston-core = { workspace = true }
baston-protocol = { workspace = true }
baston-scripting = { workspace = true }
baston-modules = { workspace = true }
baston-config = { workspace = true }
dashmap = { workspace = true }
async-nats = { workspace = true }
bincode = { workspace = true }
uuid = { workspace = true }
metrics = { workspace = true }
futures = { workspace = true }
rayon = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
baston-escrow-plugin = { workspace = true, optional = true }

[features]
# Optional CFX Asset Escrow support. Off by default so the core never pulls the
# plugin. Enable on a Windows build that needs to run escrowed resources:
#   cargo build -p baston-zone --features escrow
escrow = ["dep:baston-escrow-plugin"]

[dev-dependencies]
tempfile = "3"
