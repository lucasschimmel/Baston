# FXServer — cfg de test escrow (ground truth svadhesive).
# But : vérifier qu'une resource escrow SANS entitlement sur la licence
# refuse de démarrer (svadhesive ne peut pas déchiffrer server.lua).
#
# Lancement (PowerShell), depuis le dossier qui contient `resources/` :
#   cd D:\Dev\Fivem\Servers\WTF\baston
#   D:\Dev\Fivem\Servers\WTF\Artifacts\windows\31623\FXServer.exe +exec escrow-test.cfg

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# ⬇️ COLLE ICI ta clé de licence (celle qui N'A PAS l'entitlement sur l'asset).
sv_licenseKey "cfxk_REPLACE_ME"

sv_hostname "Escrow Test (no entitlement)"
sv_maxclients 8
sv_projectName "escrow-test"

# Reste hors de la liste publique des serveurs pour un test privé.
sv_master1 ""

# La seule resource qui nous intéresse : elle doit ÉCHOUER sans entitlement.
ensure baston-escrow-test
