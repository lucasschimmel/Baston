# BASTON runtime configuration (Phase B)

[server]
name = "BASTON Dev"
port = 30120
max_players = 32
# All clients must run the same GTA build for non-OneSync P2P sync; the
# client auto-switches builds pre-connect when this is advertised.
enforce_game_build = "3258"

[auth]
# RSA public key endpoint for offline CFX ticket verification
# (same endpoint FXServer uses: CNL_ENDPOINT api/ticket/pubkey).
pubkey_url = "https://lambda.fivem.net/api/ticket/pubkey"
http_timeout_secs = 5

[resources]
path = "resources"

[udp]
# ENet game transport. Defaults to server.port (FiveM muxes TCP+UDP on one port).
# port = 30120
poll_interval_ms = 5

[connection]
# Seconds to wait for playerConnecting deferrals before kicking.
deferral_timeout_secs = 10

[dev]
hot_reload = true
# Phase B: real CFX auth. Flip to true only for offline dev without a launcher.
auth_bypass = false

# CFX server-licence integration. BASTON never validates a licence itself and
# never talks to CFX — the genuine, unmodified FXServer component does. See
# docs/licensing.md.
[license]
# "off"      : no check (dev/LAN only — warns every boot). Default for this dev cfg.
# "gate"     : require a well-formed sv_license_key in config (shape only, no sidecar).
# "verified" : run the official FXServer sidecar to validate the key against CFX and
#              enforce the verdict + entitlements locally (Windows + --features escrow).
mode = "off"
# Your CFX server licence, created at https://portal.cfx.re. Required for gate/verified.
sv_license_key = ""
# mode = "verified": path to an official FXServer.exe you downloaded from CFX.
# BASTON never ships this binary. Shares one sidecar process with [escrow] when both on.
# fxserver_path = "Artifacts/windows/31623/FXServer.exe"
# Private, localhost-only port for the sidecar (verified/escrow). Nothing connects to
# it (IPC is a local file-drop) — it only keeps the sidecar off BASTON's public port.
# Give each BASTON instance on a host a distinct value if you run several.
# sidecar_port = 30130

# Monitoring/control HTTP API keys (served on meshing.admin_port, default
# 8080). Each key is a named bearer token with explicit permissions; control
# actions are appended to the audit log. See docs/api.md.
[api]
audit_log = "baston-audit.jsonl"
# [[api.keys]]
# name = "discord-bot"                    # identifies the key in the audit log
# token = "REPLACE_ME_openssl_rand_hex_32"
# permissions = ["monitor.read"]          # monitor.read | resource.control | player.kick | zone.drain

# CFX Asset Escrow support (Phase D-bis). Off by default. See
# docs/escrow-support.md. Requires a Windows build with `--features escrow`.
[escrow]
enabled = false
# "sidecar" (supported) — a minimal FXServer subprocess decrypts via svadhesive.
# "direct" (FFI) is unsupported: svadhesive.dll exposes no callable decrypt symbol.
backend = "sidecar"
# CFX server licence ("license:..."), required when enabled.
server_license = ""
# backend = "sidecar": path to FXServer.exe
fxserver_path = "Artifacts/windows/31623/FXServer.exe"
# backend = "direct": path to svadhesive.dll (unsupported backend)
# dll_path = "Artifacts/windows/31623/svadhesive.dll"

# NOTE: no [tls] section on purpose. The FiveM client sends some requests to
# the game port in plaintext HTTP; a TLS-only listener breaks them with
# "Received HTTP/0.9 when not allowed". Phase B validated the plain-HTTP path
# on canary 31725 — getConfiguration hands out a literal http://<host>/files
# fileServer URL so packfile downloads stay on plain HTTP (no %s → no https
# rewrite). Re-enabling [tls] here reintroduces the HTTP/0.9 failure.
# Proper HTTPS needs first-byte TLS/plain multiplexing on 30120 (future work).
