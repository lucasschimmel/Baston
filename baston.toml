# BASTON runtime configuration (Phase B)

[server]
name = "BASTON Dev"
port = 30120
max_players = 32

[auth]
# RSA public key endpoint for offline CFX ticket verification
# (same endpoint FXServer uses: CNL_ENDPOINT api/ticket/pubkey).
pubkey_url = "https://lambda.fivem.net/api/ticket/pubkey"
http_timeout_secs = 5

[resources]
path = "resources"

[udp]
# ENet game transport. Defaults to server.port (FiveM muxes TCP+UDP on one port).
# port = 30120
poll_interval_ms = 5

[connection]
# Seconds to wait for playerConnecting deferrals before kicking.
deferral_timeout_secs = 10

[dev]
hot_reload = true
# Phase B: real CFX auth. Flip to true only for offline dev without a launcher.
auth_bypass = false

# CFX Asset Escrow support (Phase D-bis). Off by default. See
# docs/escrow-support.md. Requires a Windows build with `--features escrow`.
[escrow]
enabled = false
# "sidecar" (supported) — a minimal FXServer subprocess decrypts via svadhesive.
# "direct" (FFI) is unsupported: svadhesive.dll exposes no callable decrypt symbol.
backend = "sidecar"
# CFX server licence ("license:..."), required when enabled.
server_license = ""
# backend = "sidecar": path to FXServer.exe
fxserver_path = "Artifacts/windows/31623/FXServer.exe"
# backend = "direct": path to svadhesive.dll (unsupported backend)
# dll_path = "Artifacts/windows/31623/svadhesive.dll"

# NOTE: no [tls] section on purpose. The FiveM client sends some requests to
# the game port in plaintext HTTP; a TLS-only listener breaks them with
# "Received HTTP/0.9 when not allowed". Phase B validated the plain-HTTP path
# on canary 31725 — getConfiguration hands out a literal http://<host>/files
# fileServer URL so packfile downloads stay on plain HTTP (no %s → no https
# rewrite). Re-enabling [tls] here reintroduces the HTTP/0.9 failure.
# Proper HTTPS needs first-byte TLS/plain multiplexing on 30120 (future work).
